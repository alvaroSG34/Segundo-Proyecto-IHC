name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'unisport-ihc' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          flutter build web --release \
            --wasm \
            --enable-wasm-deferred-loading \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}"

      - name: Publish to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Falta el secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Falta el secret CLOUDFLARE_ACCOUNT_ID}"

          npx --yes wrangler@4 pages project list --json > "$RUNNER_TEMP/cloudflare-projects.json"
          project_exists=$(jq --arg name "$CLOUDFLARE_PROJECT_NAME" \
            'any(.[]; .["Project Name"] == $name)' "$RUNNER_TEMP/cloudflare-projects.json")

          if [ "$project_exists" = "false" ]; then
            npx --yes wrangler@4 pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch=main
          fi

          npx --yes wrangler@4 pages deploy build/web \
            --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
