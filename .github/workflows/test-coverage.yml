name: CI Tests & Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: Pruebas unitarias, widgets y cobertura de código (tipo pnpm test)
  # =========================================================================
  unit-tests-coverage:
    name: Unit & Widget Tests (Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static code analysis
        run: flutter analyze

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: Generate console and GitHub summary
        run: dart run tool/reporte_cobertura.dart

      - name: Install lcov tools
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Generate HTML coverage report
        run: |
          genhtml coverage/lcov.info \
            -o coverage/html \
            --title "UniSport Coverage Report" \
            --show-details \
            --legend || true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/html/
          retention-days: 14

  # =========================================================================
  # JOB 2: Pruebas de integración E2E en emulador Android con aceleración KVM
  # =========================================================================
  e2e-android-tests:
    name: E2E Tests on Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run E2E tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/run_e2e_ci.sh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          E2E_CORREO: ${{ secrets.E2E_CORREO }}
          E2E_CLAVE: ${{ secrets.E2E_CLAVE }}
          E2E_CORREO_AUXILIAR: ${{ secrets.E2E_CORREO_AUXILIAR }}
          E2E_CLAVE_AUXILIAR: ${{ secrets.E2E_CLAVE_AUXILIAR }}
          E2E_CORREO_EXISTENTE: ${{ secrets.E2E_CORREO_EXISTENTE }}
          E2E_ORGANIZADOR_CORREO: ${{ secrets.E2E_ORGANIZADOR_CORREO }}
          E2E_ORGANIZADOR_CLAVE: ${{ secrets.E2E_ORGANIZADOR_CLAVE }}
          E2E_TITULAR_CORREO: ${{ secrets.E2E_TITULAR_CORREO }}
          E2E_TITULAR_CLAVE: ${{ secrets.E2E_TITULAR_CLAVE }}
          E2E_SUPLENTE_CORREO: ${{ secrets.E2E_SUPLENTE_CORREO }}
          E2E_SUPLENTE_CLAVE: ${{ secrets.E2E_SUPLENTE_CLAVE }}
          E2E_CAPITAN_CORREO: ${{ secrets.E2E_CAPITAN_CORREO }}
          E2E_CAPITAN_CLAVE: ${{ secrets.E2E_CAPITAN_CLAVE }}
